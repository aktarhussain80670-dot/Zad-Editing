<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Full 128x128 Circular Clip Path -->
    <clipPath id="chrome-circle">
      <circle cx="64" cy="64" r="60" />
    </clipPath>
  </defs>

  <!-- Chrome Outer Segments (Transparent Background, Clipped to Circle) -->
  <g clip-path="url(#chrome-circle)">
    <!-- Green Segment (Bottom-Left) -->
    <path d="M 0 0 L 0 128 L 64 128 L 89.98 94 L 64 64 Z" fill="#34A853" />

    <!-- Yellow Segment (Bottom-Right) -->
    <path d="M 64 34 L 128 34 L 128 128 L 38.02 128 L 64 94 Z" fill="#FBBC04" />

    <!-- Subtle Fold Shadows for Authentic Chrome Look -->
    <polygon points="64,34 115.96,34 78,52" fill="#000000" fill-opacity="0.1" />
    <polygon points="38.02,79 12.04,34 48,56" fill="#000000" fill-opacity="0.1" />
    <polygon points="89.98,79 64,124 70,86" fill="#000000" fill-opacity="0.1" />

    <!-- Red Segment (Top) -->
    <path d="M 0 0 L 128 0 L 128 34 L 64 34 L 38.02 79 L 12.04 34 Z" fill="#EA4335" />
  </g>

  <!-- Center White Ring & Inner Blue Core -->
  <circle cx="64" cy="64" r="30" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="24" fill="#4285F4" />
</svg>
