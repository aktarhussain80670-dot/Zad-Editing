<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9:16 Animated Grid Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas-9-16 {
      position: relative;
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
      background-color: #fafafa;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    @media (max-aspect-ratio: 9/16) {
      .canvas-9-16 {
        width: 100vw;
        height: auto;
      }
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid-line {
      stroke: #e6e6e6;
      stroke-width: 1;
    }

    .plus-icon {
      stroke: #b5b5b5;
      stroke-width: 1.3;
      stroke-linecap: round;
      transform-box: fill-box;
      transform-origin: center;
      animation: spinLoop 6s linear infinite;
    }

    @keyframes spinLoop {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="canvas-9-16">
    <svg id="gridSvg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="fadeMaskGrad" cx="50%" cy="50%" r="52%" fx="50%" fy="50%">
          <stop offset="45%" stop-color="white" stop-opacity="1" />
          <stop offset="88%" stop-color="white" stop-opacity="0.25" />
          <stop offset="100%" stop-color="white" stop-opacity="0" />
        </radialGradient>

        <mask id="gridFadeMask">
          <rect width="1080" height="1920" fill="url(#fadeMaskGrad)" />
        </mask>
      </defs>

      <g mask="url(#gridFadeMask)" id="gridLayer"></g>
    </svg>
  </div>

  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const gridLayer = document.getElementById("gridLayer");

    const width = 1080;
    const height = 1920;
    const cellSize = 135;

    for (let x = 0; x <= width; x += cellSize) {
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", x);
      line.setAttribute("y1", 0);
      line.setAttribute("x2", x);
      line.setAttribute("y2", height);
      line.setAttribute("class", "grid-line");
      gridLayer.appendChild(line);
    }

    for (let y = 0; y <= height; y += cellSize) {
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", 0);
      line.setAttribute("y1", y);
      line.setAttribute("x2", width);
      line.setAttribute("y2", y);
      line.setAttribute("class", "grid-line");
      gridLayer.appendChild(line);
    }

    const plusSize = 8;

    for (let x = cellSize; x < width; x += cellSize) {
      for (let y = cellSize; y < height; y += cellSize) {
        const plusGroup = document.createElementNS(svgNS, "g");
        plusGroup.setAttribute("class", "plus-icon");

        const delay = ((x + y) / 400) * -1;
        plusGroup.style.animationDelay = `${delay}s`;

        const hBar = document.createElementNS(svgNS, "line");
        hBar.setAttribute("x1", x - plusSize);
        hBar.setAttribute("y1", y);
        hBar.setAttribute("x2", x + plusSize);
        hBar.setAttribute("y2", y);

        const vBar = document.createElementNS(svgNS, "line");
        vBar.setAttribute("x1", x);
        vBar.setAttribute("y1", y - plusSize);
        vBar.setAttribute("x2", x);
        vBar.setAttribute("y2", y + plusSize);

        plusGroup.appendChild(hBar);
        plusGroup.appendChild(vBar);
        gridLayer.appendChild(plusGroup);
      }
    }
  </script>

</body>
</html>
