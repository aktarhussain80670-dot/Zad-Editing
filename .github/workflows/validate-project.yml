name: Validate Universal Video Editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade Python packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install editor and development extras
        run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q ai config core providers services main.py tests
      - run: python scripts/check_project_structure.py
      - run: python -m pytest -q
      - run: python -m ruff check ai config core providers services tests main.py
